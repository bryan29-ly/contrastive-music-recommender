audio_dir: data/raw            # your own tracks (any folder, nested ok)
segments_dir: data/segments_gab    # waveform segments (FLAC int16) + manifest
catalog_path: data/catalog.csv

# random split ratios (folder mode)
val_ratio: 0.1
test_ratio: 0.1

# segment selection (offline)
segment_seconds: 12
n_segments_per_track: 3
min_track_seconds: 24          # 2 * segment_seconds: two segments guaranteed
crop_frames: 768               # contrastive view length (~8.9 s of mel frames)
cross_segment_prob: 1.0        # prob. of drawing the two views from different segments

# FMA metadata mode (optional, --source fma)
fma_metadata_dir: data/metadata/fma_metadata
