encoder:
  base_channels: 64      # 2D ResNet front-end width
  embed_dim: 512         # transformer width = dim of h
  n_layers: 4            # temporal transformer depth
  n_heads: 8
  ffn_dim: 1024
  dropout: 0.1
projection:
  hidden_dim: 512
  output_dim: 128        # z (only for the contrastive loss)
