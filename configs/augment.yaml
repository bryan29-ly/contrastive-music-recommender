# All augmentations preserve rhythm/groove. They are applied on the log-mel,
# on GPU, in the training loop. Amplitudes assume standardized input (~unit std).
time_stretch:
  enabled: true
  range: [0.90, 1.10]    # ±10% tempo tolerance, without destroying the groove
  prob: 0.5
gain_range: 0.36         # +/- 6 dB once scaled by the norm std; covers master loudness
eq:
  enabled: true
  n_bands: 8             # control points of the smooth random frequency curve
  strength: 0.6          # mastering invariance, kept below the natural timbre spread
spec_masking:
  time_mask_param: 20    # low, so a full beat is never erased
  freq_mask_param: 20
  n_time_masks: 1
  n_freq_masks: 1
noise_std: 0.05          # light texture robustness (relative to standardized scale)
